<!doctype html>
<html lang="en">
  <head>
    <script>
      if (window.location.pathname === '/join') {
        const invitation = new URLSearchParams(window.location.hash.slice(1)).get('invite');
        window.history.replaceState(null, '', window.location.pathname + window.location.search);
        let token = invitation && /^[A-Za-z0-9_-]{43}$/.test(invitation) ? invitation : null;
        window.consumeBankPiggyInvitation = () => {
          const value = token;
          token = null;
          return value;
        };
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#49362b" />
    <meta
      name="description"
      content="A clearer picture of your money, together. Plan household expenses, shared bills, and savings with Bank Piggy."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=DM+Sans:wght@400;450;500;550;600;650;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="/assets/favicon.png" />
    <title>Bank Piggy — Your money, together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
