services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bankpiggy
      POSTGRES_PASSWORD: bankpiggy
      POSTGRES_DB: bankpiggy
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - bank-piggy-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bankpiggy -d bankpiggy']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bank-piggy-data:
